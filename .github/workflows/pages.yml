# Publishes the demo-mode storefront to GitHub Pages on every push to main.
# Pages has no fallback to index.html, so this build uses hash URLs (/#/shop).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --base ./
        env:
          VITE_PUBLIC_ROUTER: hash
      - run: npm run check:bundle-secrets
      - name: Push the build to the gh-pages branch
        working-directory: dist
        run: |
          rm -f _headers _redirects
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
