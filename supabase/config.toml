# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "made-new"

[api]
port = 54321
schemas = ["public"]
max_rows = 200

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "25MiB"
